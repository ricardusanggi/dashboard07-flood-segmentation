# docker-compose.yml
version: "3.9"

services:

  backend:
    build: ./backend
    container_name: flood_backend
    ports:
      - "8007:8007"

    volumes:
      - ./backend:/app
      - /opt/flood_segmentation/storage:/app/storage
      # akses docker host
      - /var/run/docker.sock:/var/run/docker.sock

    env_file:
      - ./backend/.env

    restart: always


  frontend:
    build:
      context: ./frontend
      network: host
    container_name: flood_frontend
    ports:
      - "3007:80"
    restart: always
    depends_on:
      - backend