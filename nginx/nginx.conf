server {
    listen 8027;

    client_max_body_size 1024M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend "dashboard07-flood-segmentation_backend:8007";
    set $predict "dashboard07-flood-segmentation_predict:8007";

    # Prediksi & info publik → predict service (replicas:2, failover)
    # Jika backend mati, route ini tetap jalan dari predict service
    location ~ ^/(predict|public)/ {
        proxy_pass         http://$predict;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        # Teruskan header CORS dari upstream
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header         Access-Control-Allow-Origin $http_origin always;
        add_header         Access-Control-Allow-Credentials true always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Semua request lain → backend utama
    # Jika backend mati, nginx akan return 502 (tidak bisa fallback ke predict
    # karena predict tidak punya DB, auth, dll)
    location / {
        proxy_pass         http://$backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # Teruskan header CORS dari upstream
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header         Access-Control-Allow-Origin $http_origin always;
        add_header         Access-Control-Allow-Credentials true always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
